<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#111315" />
    <title>Inventario del carrito de herramientas</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="topbar">
      <button class="brand" id="homeButton" aria-label="Regresar al carrito">
        <span class="brand-mark">GW</span>
        <span><strong>Inventario visual</strong><small>Carrito de mantenimiento</small></span>
      </button>
      <span class="status"><i></i> Catálogo activo</span>
    </header>

    <main id="app"></main>

    <div class="modal-backdrop hidden" id="modalBackdrop">
      <article class="tool-modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
        <button class="close" id="closeModal" aria-label="Cerrar">×</button>
        <div id="modalContent"></div>
      </article>
    </div>

    <script src="./app.js"></script>
  </body>
</html>
